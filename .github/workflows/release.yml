name: Release

# Builds the installers from a version tag and attaches them to a draft
# GitHub release. Updater artifacts are signed when the repository has the
# TAURI_SIGNING_PRIVATE_KEY secret and the VELOX_UPDATER_PUBKEY variable
# (see RELEASE_CHECKLIST.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # linuxdeploy runs without FUSE on CI runners.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundled tools (checksum-verified), native host, extensions
        run: node scripts/prepare-release.mjs --target ${{ matrix.target }}
      - name: Third-party notices
        run: node scripts/third-party-notices.mjs
      - name: Updater signing (optional)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.VELOX_UPDATER_PUBKEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            node -e 'require("fs").writeFileSync("apps/desktop/src-tauri/tauri.updater.conf.json", JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.PUBKEY}}}))'
            echo "UPDATER_CONFIG=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "::warning::updater signing is not configured; the release has no update artifacts"
          fi
      # Manual runs (workflow_dispatch on a branch) build the same installers
      # and attach them to the workflow run instead of creating a release,
      # e.g. for the clean-machine test.
      - name: Build installers (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter desktop tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json $UPDATER_CONFIG
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json ${{ env.UPDATER_CONFIG }}
          tagName: ${{ github.ref_name }}
          releaseName: Velox Download Manager ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
      - name: Check installer contents
        shell: bash
        run: scripts/check-installer.sh target/${{ matrix.target }}/release/bundle ${{ matrix.target }}
      - name: Checksums
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release/bundle
          find . -type f \( -name '*-setup.exe' -o -name '*.AppImage' \) -exec sha256sum {} + | tee SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: installer-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
