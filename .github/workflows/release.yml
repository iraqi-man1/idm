name: Release

# Builds the installers.
# * A pushed version tag (v*) builds them with tauri-action into a draft
#   GitHub release (with signed updater artifacts when the repository has the
#   TAURI_SIGNING_PRIVATE_KEY secret and the VELOX_UPDATER_PUBKEY variable).
# * A manual run with "release_tag" (from the default branch) creates a draft
#   release, attaches both installers and their SHA-256 sums, and publishes it
#   (as a pre-release unless unticked) once every build succeeded.
# * A manual run without "release_tag" only attaches the installers to the
#   workflow run (e.g. for the clean-machine test).
# See RELEASE_CHECKLIST.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0, must match the app version). Empty: build only."
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # linuxdeploy runs without FUSE on CI runners.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match the app version $version"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
            || { echo "::error::releases are made from the default branch"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"; exit 1
          fi
      - name: Create a draft release
        run: |
          sed "s/{{version}}/${TAG#v}/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Velox Download Manager $TAG" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    needs: prepare
    # Also runs when "prepare" was skipped (tag push, build-only run).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundled tools (checksum-verified), native host, extensions
        run: node scripts/prepare-release.mjs --target ${{ matrix.target }}
      - name: Third-party notices
        run: node scripts/third-party-notices.mjs
      - name: Updater signing (optional)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.VELOX_UPDATER_PUBKEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            node -e 'require("fs").writeFileSync("apps/desktop/src-tauri/tauri.updater.conf.json", JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.PUBKEY}}}))'
            echo "UPDATER_CONFIG=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "::warning::updater signing is not configured; the release has no update artifacts"
          fi
      # Manual runs build with the Tauri CLI; tag pushes use tauri-action.
      - name: Build installers (no tauri-action)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter desktop tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json $UPDATER_CONFIG
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json ${{ env.UPDATER_CONFIG }}
          tagName: ${{ github.ref_name }}
          releaseName: Velox Download Manager ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
      - name: Check installer contents
        shell: bash
        run: scripts/check-installer.sh target/${{ matrix.target }}/release/bundle ${{ matrix.target }}
      - name: Checksums
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release/bundle
          find . -type f \( -name '*-setup.exe' -o -name '*.AppImage' \) -exec sha256sum {} + | tee SHA256SUMS.txt
          test -s SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: installer-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          bundle=target/${{ matrix.target }}/release/bundle
          mkdir -p release-assets
          # GitHub turns spaces in asset names into dots; use dashes so the
          # checksum file names the files people download.
          for f in "$bundle"/nsis/*-setup.exe "$bundle"/appimage/*.AppImage; do
            name=$(basename "$f")
            cp "$f" "release-assets/${name// /-}"
          done
          cd release-assets
          files=(*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no installer found"; exit 1; }
          sums="SHA256SUMS-${{ matrix.target }}.txt"
          sha256sum "${files[@]}" | sed 's/ \*/  /' | tee "$sums"
          gh release upload "$TAG" "${files[@]}" "$sums" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=${{ inputs.prerelease }}
