[package]
name = "velox-scheduler"
description = "Queues, schedules, post-completion actions and power-aware queue processing for Velox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
velox-types = { workspace = true }
velox-core = { workspace = true }
velox-persistence = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power"] }
windows = { version = "0.62", features = ["Networking_Connectivity", "Win32_System_Com"] }

[dev-dependencies]
velox-test-server = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
