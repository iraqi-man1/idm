[package]
name = "velox-ftp"
description = "FTP, FTPS and SFTP transports for Velox (resumable, multi-connection reads)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
velox-types = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
suppaftp = { version = "12.1", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0"
sha2 = { workspace = true }
base64 = "0.22"
dirs = { workspace = true }

[dev-dependencies]
velox-test-server = { workspace = true }
tempfile = { workspace = true }
rand = "0.10"
