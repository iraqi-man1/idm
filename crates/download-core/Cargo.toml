[package]
name = "velox-core"
description = "Velox download engine: segmented transfers, crash-safe persistence, queues of running tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
velox-types = { workspace = true }
velox-segments = { workspace = true }
velox-http = { workspace = true }
velox-ftp = { workspace = true }
percent-encoding = { workspace = true }
velox-persistence = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
hex = { workspace = true }
dirs = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
rand = "0.10"
velox-test-server = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
