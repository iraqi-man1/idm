[package]
name = "velox-desktop"
description = "Velox Download Manager desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "velox-desktop"

[lib]
name = "velox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "velox-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
velox-types = { workspace = true }
velox-core = { workspace = true }
velox-persistence = { workspace = true }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.13"
tauri-plugin-autostart = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-shell = "2.4"
tauri-plugin-clipboard-manager = "2.4"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
parking_lot = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[features]
# Required by Tauri for production builds (disables the dev server URL).
custom-protocol = ["tauri/custom-protocol"]
